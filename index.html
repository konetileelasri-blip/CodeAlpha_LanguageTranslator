<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Language Translator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌐 AI Language Translator</h1>

        <p class="subtitle">
            Translate text quickly and easily using AI-powered translation.
        </p>

        <!-- Input Section -->
        <div class="translator-box">

            <div class="input-section">

                <label for="inputText">Enter Text</label>

                <textarea
                    id="inputText"
                    placeholder="Type your text here..."
                ></textarea>

            </div>

            <!-- Language Selection -->

            <div class="language-selection">

                <div>
                    <label for="sourceLanguage">From</label>

                    <select id="sourceLanguage">
                        <option value="en">English</option>
                        <option value="te">Telugu</option>
                        <option value="hi">Hindi</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                        <option value="de">German</option>
                    </select>
                </div>


                <button id="swapBtn" class="arrow" type="button">
    ⇄
</button>


                <div>
                    <label for="targetLanguage">To</label>

                    <select id="targetLanguage">
                        <option value="te">Telugu</option>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                        <option value="de">German</option>
                    </select>
                </div>

            </div>


            <!-- Translate Button -->

            <button id="translateBtn">
                Translate
            </button>


            <!-- Output Section -->

            <div class="output-section">

                <label for="translatedText">
                    Translated Text
                </label>

                <div id="translatedText">
                    Your translation will appear here...
                </div>

            </div>


            <!-- Extra Buttons -->

            <div class="action-buttons">

                <button id="copyBtn">
                    📋 Copy
                </button>

                <button id="speakBtn">
                    🔊 Speak
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
